<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Stellest 3D Lens - Premium</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #020812;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .stellest-hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, rgba(55, 165, 255, 0.22) 0%, rgba(7, 24, 39, 0.82) 48%, rgba(2, 8, 18, 1) 100%),
        linear-gradient(135deg, #04101c 0%, #010408 100%);
    }

    .stellest-hero::before {
      content: "";
      position: absolute;
      left: -10%;
      top: 51%;
      width: 120%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(137, 207, 255, 0.45), transparent);
      box-shadow: 0 0 22px rgba(72, 175, 255, 0.34);
      z-index: 1;
      pointer-events: none;
    }

    .stellest-brand {
      position: absolute;
      top: 30px;
      left: 34px;
      z-index: 6;
      color: #eaf7ff;
      pointer-events: none;
      text-shadow: 0 0 28px rgba(93, 190, 255, 0.22);
    }

    .stellest-brand__eyebrow {
      margin-bottom: 3px;
      font-size: 13px;
      line-height: 1;
      letter-spacing: 5px;
      font-weight: 700;
      opacity: 0.86;
    }

    .stellest-brand__title {
      font-size: clamp(34px, 7vw, 58px);
      line-height: 0.95;
      letter-spacing: -0.06em;
      font-weight: 300;
      color: #dff4ff;
    }

    #stellestCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .micro-popup {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 320px;
      padding: 26px 28px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      background: rgba(10, 25, 45, 0.48);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow:
        0 16px 42px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.20);
      color: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
      transform: translate(118px, -110px) scale(0.95);
      transition:
        opacity 0.36s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.36s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .micro-popup.active {
      opacity: 1;
      transform: translate(138px, -110px) scale(1);
    }

    .popup-num {
      margin-bottom: 8px;
      font-size: 52px;
      line-height: 1;
      font-weight: 300;
      background: linear-gradient(135deg, #ffffff 0%, #8bcfff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .popup-title {
      margin-bottom: 12px;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 650;
      color: #bde4ff;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .popup-text {
      margin: 0;
      font-size: 15px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.76);
    }

    .popup-line {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 160px;
      height: 1px;
      transform: translate(-18px, -4px);
      background: linear-gradient(90deg, rgba(137, 207, 255, 0.9), transparent);
      box-shadow: 0 0 18px rgba(72, 175, 255, 0.44);
      opacity: 0;
      pointer-events: none;
      z-index: 4;
      transition: opacity 0.3s ease;
    }

    .popup-line.active {
      opacity: 1;
    }

    @media (max-width: 900px) {
      .stellest-brand {
        top: 22px;
        left: 24px;
      }

      .stellest-brand__eyebrow {
        font-size: 11px;
        letter-spacing: 4px;
      }

      .stellest-brand__title {
        font-size: 38px;
      }

      .micro-popup {
        left: 20px;
        right: 20px;
        top: auto;
        bottom: 32px;
        width: calc(100% - 40px);
        box-sizing: border-box;
        transform: translateY(18px) scale(0.96);
      }

      .micro-popup.active {
        transform: translateY(0) scale(1);
      }

      .popup-line {
        display: none;
      }
    }
  </style>
</head>

<body>
  <section class="stellest-hero">
    <div class="stellest-brand">
      <div class="stellest-brand__eyebrow">ESSILOR</div>
      <div class="stellest-brand__title">Stellest</div>
    </div>

    <div id="stellestCanvas"></div>

    <div class="popup-line" id="popupLine"></div>

    <div class="micro-popup" id="microPopup">
      <div class="popup-num">1021</div>
      <div class="popup-title">микролинза</div>
      <p class="popup-text">
        Микроструктура формирует объёмную зону дефокуса, эффективно замедляя прогрессирование близорукости у детей.
      </p>
    </div>
  </section>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

    const container = document.getElementById("stellestCanvas");
    const popup = document.getElementById("microPopup");
    const popupLine = document.getElementById("popupLine");

    const MODEL_FILE = "./Stellest%202.0.glb";

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      27,
      container.clientWidth / container.clientHeight,
      0.1,
      100
    );

    camera.position.set(0, 0, 4.55);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;

    container.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);

    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(container.clientWidth, container.clientHeight),
      0.34,
      0.62,
      0.14
    );

    composer.addPass(bloomPass);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    const ambient = new THREE.AmbientLight(0xffffff, 0.92);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xd7f4ff, 2.7);
    keyLight.position.set(-3, 3, 4);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x62c9ff, 3.2);
    rimLight.position.set(3, -2, -2);
    scene.add(rimLight);

    const frontLight = new THREE.PointLight(0x8cdbff, 2.6, 8);
    frontLight.position.set(0, 0.8, 2.8);
    scene.add(frontLight);

    let mixer = null;
    let modelRoot = null;
    let introFinished = false;
    let isHoveringMicro = false;
    let hoverProgress = 0;
    let idleAngle = 0;

    const microMeshes = [];
    const edgeMeshes = [];

    const clock = new THREE.Clock();

    const mouse = new THREE.Vector2(0, 0);
    const targetRotation = new THREE.Vector2(0, 0);

    const colorMicroBase = new THREE.Color(0xb7ecff);
    const colorMicroHover = new THREE.Color(0xffffff);

    const emissiveBase = new THREE.Color(0x2daaff);
    const emissiveHover = new THREE.Color(0xd8fbff);

    const microMaterial = new THREE.MeshPhysicalMaterial({
      color: colorMicroBase,
      emissive: emissiveBase,
      emissiveIntensity: 1.05,
      transparent: true,
      opacity: 1.0,
      roughness: 0.04,
      transmission: 0.02,
      side: THREE.DoubleSide,
      depthTest: false,
      depthWrite: false
    });

    const edgeMaterial = new THREE.MeshBasicMaterial({
      color: new THREE.Color(0x8bcfff),
      transparent: true,
      opacity: 0.96,
      side: THREE.DoubleSide,
      depthTest: false,
      depthWrite: false
    });

    const lensMaterial = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(0x70cfff),
      transmission: 0.88,
      opacity: 0.74,
      metalness: 0,
      roughness: 0.018,
      ior: 1.52,
      thickness: 0.55,
      clearcoat: 1.0,
      clearcoatRoughness: 0.018,
      attenuationColor: new THREE.Color(0x5caeff),
      attenuationDistance: 2.0,
      side: THREE.DoubleSide,
      transparent: true,
      depthWrite: false
    });

    const loader = new GLTFLoader();

    loader.load(
      MODEL_FILE,

      (gltf) => {
        const originalScene = gltf.scene;
        let modelInner = originalScene;

        modelInner.traverse((obj) => {
          const name = (obj.name || "").toLowerCase();

          if (
            name.includes("background") ||
            name.includes("floor") ||
            name.includes("strip") ||
            name.includes("light") ||
            name.includes("camera")
          ) {
            obj.visible = false;
          }

          if (!obj.isMesh) return;

          obj.frustumCulled = false;

          if (name.includes("micro")) {
            obj.material = microMaterial;
            obj.renderOrder = 30;
            microMeshes.push(obj);
          }

          else if (name.includes("edge") || name.includes("glow")) {
            obj.material = edgeMaterial;
            obj.renderOrder = 20;
            edgeMeshes.push(obj);
          }

          else if (name.includes("lens") || name.includes("glass")) {
            obj.material = lensMaterial;
            obj.renderOrder = 5;
          }
        });

        const box = new THREE.Box3().setFromObject(modelInner);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        modelInner.position.sub(center);

        const pivot = new THREE.Group();
        scene.add(pivot);
        pivot.add(modelInner);

        modelRoot = pivot;

        const maxSize = Math.max(size.x, size.y, size.z);

        modelRoot.scale.setScalar(3.35 / maxSize);
        modelRoot.position.y = -0.12;

        if (gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(originalScene);

          gltf.animations.forEach((clip) => {
            const action = mixer.clipAction(clip);
            action.reset();
            action.setLoop(THREE.LoopOnce, 1);
            action.clampWhenFinished = true;
            action.play();
          });

          setTimeout(() => {
            introFinished = true;
          }, 4600);
        } else {
          introFinished = true;
        }
      },

      undefined,

      (error) => {
        console.error("Ошибка загрузки GLB:", error);
      }
    );

    function checkPointer(event) {
      const rect = container.getBoundingClientRect();

      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      mouse.x = (x / rect.width) * 2 - 1;
      mouse.y = -(y / rect.height) * 2 + 1;

      const centerX = rect.width * 0.5;
      const centerY = rect.height * 0.53;

      const dx = x - centerX;
      const dy = y - centerY;

      const distance = Math.sqrt(dx * dx + dy * dy);
      const minSide = Math.min(rect.width, rect.height);

      const isInside = distance > minSide * 0.07 && distance < minSide * 0.42;

      if (isHoveringMicro !== isInside) {
        isHoveringMicro = isInside;
        popup.classList.toggle("active", isInside);
        popupLine.classList.toggle("active", isInside);
      }
    }

    container.addEventListener("mousemove", checkPointer);

    container.addEventListener("mouseleave", () => {
      isHoveringMicro = false;
      mouse.set(0, 0);
      popup.classList.remove("active");
      popupLine.classList.remove("active");
    });

    container.addEventListener("touchstart", (event) => {
      if (event.touches && event.touches[0]) {
        checkPointer(event.touches[0]);
      }
    }, { passive: true });

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1);

      if (mixer) {
        mixer.update(delta);
      }

      if (modelRoot && introFinished) {
        if (!isHoveringMicro) {
          idleAngle += delta * 0.48;
        }

        targetRotation.x = mouse.y * 0.08;
        targetRotation.y = mouse.x * 0.10 + Math.sin(idleAngle) * 0.12;

        modelRoot.rotation.x += (targetRotation.x - modelRoot.rotation.x) * delta * 4;
        modelRoot.rotation.y += (targetRotation.y - modelRoot.rotation.y) * delta * 4;

        const targetHoverVal = isHoveringMicro ? 1 : 0;
        hoverProgress += (targetHoverVal - hoverProgress) * delta * 6;

        microMaterial.opacity = 1.0;
        microMaterial.emissiveIntensity = 1.05 + hoverProgress * 3.2;
        microMaterial.color.lerpColors(colorMicroBase, colorMicroHover, hoverProgress);
        microMaterial.emissive.lerpColors(emissiveBase, emissiveHover, hoverProgress);

        edgeMaterial.opacity = 0.96 + hoverProgress * 0.04;

        bloomPass.strength = 0.34 + hoverProgress * 1.75;
        bloomPass.radius = 0.62 + hoverProgress * 0.28;
        bloomPass.threshold = 0.14 - hoverProgress * 0.06;
      }

      composer.render();
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(container.clientWidth, container.clientHeight);
      composer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
