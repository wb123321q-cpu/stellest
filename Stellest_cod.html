<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Stellest 3D Lens</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #0a2638;
    }

    .stellest-hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 22% 28%, rgba(126, 214, 255, 0.20), transparent 34%),
        radial-gradient(circle at 70% 35%, rgba(53, 139, 190, 0.20), transparent 36%),
        radial-gradient(circle at 50% 65%, rgba(4, 25, 42, 0.20), transparent 52%),
        linear-gradient(145deg, #12364b 0%, #0c2a3e 42%, #071b2b 100%);
    }

    .stellest-hero::before {
      content: "";
      position: absolute;
      left: -10%;
      top: 52%;
      width: 120%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(170, 225, 255, 0.36), transparent);
      box-shadow: 0 0 20px rgba(92, 185, 240, 0.28);
      z-index: 1;
      pointer-events: none;
    }

    .stellest-hero::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 52%;
      width: 620px;
      height: 620px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(130, 215, 255, 0.10), rgba(60, 150, 205, 0.04) 38%, transparent 70%);
      filter: blur(18px);
      z-index: 1;
      pointer-events: none;
    }

    .stellest-brand {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      pointer-events: none;
      color: #eaf7ff;
      text-shadow: 0 0 24px rgba(93, 190, 255, 0.22);
      white-space: nowrap;
    }

    .stellest-brand__eyebrow {
      margin-bottom: 4px;
      font-size: 10px;
      line-height: 1;
      letter-spacing: 4px;
      font-weight: 700;
      opacity: 0.78;
    }

    .stellest-brand__title {
      font-size: clamp(28px, 5vw, 42px);
      line-height: 0.95;
      letter-spacing: -0.045em;
      font-weight: 300;
      color: #e7f7ff;
    }

    #stellestCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .micro-popup {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 315px;
      padding: 22px 24px;
      border: 1px solid rgba(180, 230, 255, 0.24);
      border-radius: 22px;
      background: rgba(8, 28, 44, 0.58);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow:
        0 16px 40px rgba(0, 0, 0, 0.28),
        0 0 34px rgba(88, 190, 255, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);
      color: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 7;
      transform: translate(112px, -90px) scale(0.96);
      transition:
        opacity 0.32s ease,
        transform 0.32s ease;
    }

    .micro-popup.active {
      opacity: 1;
      transform: translate(130px, -90px) scale(1);
    }

    .popup-num {
      margin-bottom: 6px;
      font-size: 46px;
      line-height: 1;
      font-weight: 300;
      background: linear-gradient(135deg, #ffffff 0%, #9de5ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .popup-title {
      margin-bottom: 12px;
      font-size: 17px;
      line-height: 1.2;
      font-weight: 650;
      color: #bdeaff;
      text-transform: uppercase;
      letter-spacing: 1.3px;
    }

    .popup-text {
      margin: 0;
      font-size: 14px;
      line-height: 1.58;
      color: rgba(255, 255, 255, 0.78);
    }

    .popup-line {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 145px;
      height: 1px;
      transform: translate(-16px, 4px);
      background: linear-gradient(90deg, rgba(170, 230, 255, 0.72), transparent);
      box-shadow: 0 0 14px rgba(72, 175, 255, 0.32);
      opacity: 0;
      pointer-events: none;
      z-index: 6;
      transition: opacity 0.28s ease;
    }

    .popup-line.active {
      opacity: 1;
    }

    @media (max-width: 900px) {
      .stellest-brand {
        top: 16px;
      }

      .stellest-brand__eyebrow {
        font-size: 9px;
        letter-spacing: 3px;
      }

      .stellest-brand__title {
        font-size: 32px;
      }

      .micro-popup {
        left: 18px;
        right: 18px;
        top: auto;
        bottom: 22px;
        width: calc(100% - 36px);
        box-sizing: border-box;
        transform: translateY(18px) scale(0.96);
      }

      .micro-popup.active {
        transform: translateY(0) scale(1);
      }

      .popup-line {
        display: none;
      }

      .popup-num {
        font-size: 40px;
      }

      .popup-title {
        font-size: 15px;
      }

      .popup-text {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <section class="stellest-hero">
    <div class="stellest-brand">
      <div class="stellest-brand__eyebrow">ESSILOR</div>
      <div class="stellest-brand__title">Stellest</div>
    </div>

    <div id="stellestCanvas"></div>

    <div class="popup-line" id="popupLine"></div>

    <div class="micro-popup" id="microPopup">
      <div class="popup-num">1021</div>
      <div class="popup-title">микролинза</div>
      <p class="popup-text">
        Микроструктура формирует объёмную зону дефокуса и помогает замедлять прогрессирование близорукости у детей.
      </p>
    </div>
  </section>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

    const container = document.getElementById("stellestCanvas");
    const popup = document.getElementById("microPopup");
    const popupLine = document.getElementById("popupLine");

    const MODEL_FILE = "./Stellest%202.0.glb";

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      26,
      container.clientWidth / container.clientHeight,
      0.1,
      100
    );

    camera.position.set(0, 0, 4.55);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.92;

    container.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);

    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(container.clientWidth, container.clientHeight),
      0.10,
      0.34,
      0.58
    );

    composer.addPass(bloomPass);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    const ambient = new THREE.AmbientLight(0xcfefff, 0.66);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xc8efff, 1.45);
    keyLight.position.set(-3, 3, 4);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x5dc2ff, 1.85);
    rimLight.position.set(3, -2, -2);
    scene.add(rimLight);

    const softFrontLight = new THREE.PointLight(0xa8e8ff, 0.65, 8);
    softFrontLight.position.set(0, 0.7, 2.8);
    scene.add(softFrontLight);

    let mixer = null;
    let modelRoot = null;
    let introFinished = false;
    let isHoveringMicro = false;
    let hoverProgress = 0;
    let idleAngle = 0;

    const clock = new THREE.Clock();
    const mouse = new THREE.Vector2(0, 0);
    const targetRotation = new THREE.Vector2(0, 0);

    const microBaseColor = new THREE.Color(0x9edfff);
    const microHoverColor = new THREE.Color(0xdff8ff);

    const microBaseEmissive = new THREE.Color(0x1d88bd);
    const microHoverEmissive = new THREE.Color(0x8cecff);

    const microMaterial = new THREE.MeshPhysicalMaterial({
      color: microBaseColor,
      emissive: microBaseEmissive,
      emissiveIntensity: 0.18,
      transparent: true,
      opacity: 0.74,
      roughness: 0.16,
      transmission: 0.0,
      side: THREE.DoubleSide,
      depthTest: false,
      depthWrite: false
    });

    const edgeMaterial = new THREE.MeshBasicMaterial({
      color: new THREE.Color(0x9edfff),
      transparent: true,
      opacity: 0.62,
      side: THREE.DoubleSide,
      depthTest: false,
      depthWrite: false
    });

    const lensMaterial = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(0xb7dce8),
      transmission: 0.78,
      opacity: 0.22,
      metalness: 0,
      roughness: 0.075,
      ior: 1.52,
      thickness: 0.36,
      clearcoat: 0.72,
      clearcoatRoughness: 0.07,
      attenuationColor: new THREE.Color(0x8fcbe0),
      attenuationDistance: 7.0,
      side: THREE.DoubleSide,
      transparent: true,
      depthWrite: false
    });

    const loader = new GLTFLoader();

    loader.load(
      MODEL_FILE,

      (gltf) => {
        const originalScene = gltf.scene;
        const modelInner = originalScene;

        modelInner.traverse((obj) => {
          const name = (obj.name || "").toLowerCase();

          if (
            name.includes("background") ||
            name.includes("floor") ||
            name.includes("strip") ||
            name.includes("light") ||
            name.includes("camera")
          ) {
            obj.visible = false;
          }

          if (!obj.isMesh) return;

          obj.frustumCulled = false;

          if (name.includes("micro")) {
            obj.material = microMaterial;
            obj.renderOrder = 30;
          }

          else if (name.includes("edge") || name.includes("glow")) {
            obj.material = edgeMaterial;
            obj.renderOrder = 20;
          }

          else if (name.includes("lens") || name.includes("glass")) {
            obj.material = lensMaterial;
            obj.renderOrder = 5;
          }
        });

        const box = new THREE.Box3().setFromObject(modelInner);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        modelInner.position.sub(center);

        const pivot = new THREE.Group();
        scene.add(pivot);
        pivot.add(modelInner);

        modelRoot = pivot;

        const maxSize = Math.max(size.x, size.y, size.z);

        modelRoot.scale.setScalar(3.44 / maxSize);
        modelRoot.position.y = -0.12;

        if (gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(originalScene);

          gltf.animations.forEach((clip) => {
            const action = mixer.clipAction(clip);
            action.reset();
            action.setLoop(THREE.LoopOnce, 1);
            action.clampWhenFinished = true;
            action.play();
          });

          setTimeout(() => {
            introFinished = true;
          }, 4600);
        } else {
          introFinished = true;
        }
      },

      undefined,

      (error) => {
        console.error("Ошибка загрузки GLB:", error);
      }
    );

    function checkPointer(event) {
      const rect = container.getBoundingClientRect();

      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      mouse.x = (x / rect.width) * 2 - 1;
      mouse.y = -(y / rect.height) * 2 + 1;

      const centerX = rect.width * 0.5;
      const centerY = rect.height * 0.53;

      const dx = x - centerX;
      const dy = y - centerY;

      const distance = Math.sqrt(dx * dx + dy * dy);
      const minSide = Math.min(rect.width, rect.height);

      const isInside = distance > minSide * 0.07 && distance < minSide * 0.42;

      if (isHoveringMicro !== isInside) {
        isHoveringMicro = isInside;
        popup.classList.toggle("active", isInside);
        popupLine.classList.toggle("active", isInside);
      }
    }

    container.addEventListener("mousemove", checkPointer);

    container.addEventListener("mouseleave", () => {
      isHoveringMicro = false;
      mouse.set(0, 0);
      popup.classList.remove("active");
      popupLine.classList.remove("active");
    });

    container.addEventListener(
      "touchstart",
      (event) => {
        if (event.touches && event.touches[0]) {
          checkPointer(event.touches[0]);
        }
      },
      { passive: true }
    );

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1);

      if (mixer) {
        mixer.update(delta);
      }

      if (modelRoot && introFinished) {
        if (!isHoveringMicro) {
          idleAngle += delta * 0.45;

          targetRotation.x = 0;
          targetRotation.y = Math.sin(idleAngle) * 0.11;

          modelRoot.rotation.x += (targetRotation.x - modelRoot.rotation.x) * delta * 4;
          modelRoot.rotation.y += (targetRotation.y - modelRoot.rotation.y) * delta * 4;
        }

        const targetHoverVal = isHoveringMicro ? 1 : 0;
        hoverProgress += (targetHoverVal - hoverProgress) * delta * 5.5;

        microMaterial.opacity = 0.74 + hoverProgress * 0.18;
        microMaterial.emissiveIntensity = 0.18 + hoverProgress * 0.62;
        microMaterial.color.lerpColors(microBaseColor, microHoverColor, hoverProgress);
        microMaterial.emissive.lerpColors(microBaseEmissive, microHoverEmissive, hoverProgress);

        edgeMaterial.opacity = 0.62 + hoverProgress * 0.10;

        lensMaterial.opacity = 0.22 + hoverProgress * 0.02;
        lensMaterial.roughness = 0.075 - hoverProgress * 0.018;

        bloomPass.strength = 0.10 + hoverProgress * 0.34;
        bloomPass.radius = 0.34 + hoverProgress * 0.14;
        bloomPass.threshold = 0.58 - hoverProgress * 0.05;
      }

      composer.render();
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(container.clientWidth, container.clientHeight);
      composer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
