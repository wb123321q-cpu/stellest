<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Stellest 3D Lens</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #020812;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .stellest-hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgba(70, 170, 255, 0.24) 0%, rgba(7, 24, 39, 0.72) 42%, rgba(2, 8, 18, 1) 82%),
        linear-gradient(135deg, #061827 0%, #020812 100%);
    }

    .stellest-hero::before {
      content: "";
      position: absolute;
      left: -10%;
      top: 50%;
      width: 120%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(125, 205, 255, 0.68), transparent);
      box-shadow: 0 0 28px rgba(72, 175, 255, 0.5);
      opacity: 0.55;
      z-index: 1;
      pointer-events: none;
    }

    .stellest-hero::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 520px;
      height: 520px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(74, 184, 255, 0.16) 0%, rgba(74, 184, 255, 0.04) 38%, transparent 70%);
      filter: blur(12px);
      z-index: 1;
      pointer-events: none;
    }

    #stellestCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      cursor: default;
    }

    .micro-popup {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(130px, -120px);
      width: 340px;
      padding: 22px 24px;
      border: 1px solid rgba(137, 207, 255, 0.55);
      border-radius: 22px;
      background: rgba(4, 20, 36, 0.68);
      backdrop-filter: blur(14px);
      box-shadow:
        0 0 60px rgba(56, 164, 255, 0.22),
        inset 0 0 30px rgba(100, 190, 255, 0.08);
      color: #eaf7ff;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .micro-popup.active {
      opacity: 1;
      transform: translate(150px, -120px);
    }

    .popup-num {
      font-size: 46px;
      line-height: 1;
      font-weight: 700;
      color: #8bcfff;
      margin-bottom: 4px;
    }

    .popup-title {
      font-size: 22px;
      line-height: 1.2;
      color: #8bcfff;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .popup-text {
      font-size: 16px;
      line-height: 1.5;
      color: rgba(234, 247, 255, 0.88);
    }

    .popup-line {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 190px;
      height: 1px;
      transform: translate(-10px, -10px);
      background: linear-gradient(90deg, rgba(137, 207, 255, 0.85), transparent);
      box-shadow: 0 0 18px rgba(72, 175, 255, 0.45);
      opacity: 0;
      pointer-events: none;
      z-index: 4;
      transition: opacity 0.22s ease;
    }

    .popup-line.active {
      opacity: 1;
    }

    @media (max-width: 900px) {
      .micro-popup {
        left: 20px;
        right: 20px;
        top: auto;
        bottom: 28px;
        width: auto;
        transform: translateY(18px);
      }

      .micro-popup.active {
        transform: translateY(0);
      }

      .popup-line {
        display: none;
      }

      .popup-num {
        font-size: 38px;
      }

      .popup-title {
        font-size: 19px;
      }

      .popup-text {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <section class="stellest-hero">
    <div id="stellestCanvas"></div>

    <div class="popup-line" id="popupLine"></div>

    <div class="micro-popup" id="microPopup">
      <div class="popup-num">1021</div>
      <div class="popup-title">микролинза</div>
      <div class="popup-text">
        Микролинзы формируют зону миопического дефокуса и помогают замедлять прогрессирование близорукости у детей.
      </div>
    </div>
  </section>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const container = document.getElementById("stellestCanvas");
    const popup = document.getElementById("microPopup");
    const popupLine = document.getElementById("popupLine");

    const MODEL_FILE = "./Stellest%202.0.glb";

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      28,
      container.clientWidth / container.clientHeight,
      0.1,
      100
    );

    camera.position.set(0.35, -0.35, 5.4);
    camera.up.set(0, 1, 0);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    container.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(0x9fdcff, 1.7);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xd7f4ff, 3.0);
    keyLight.position.set(-3, -4, 4);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x62c9ff, 2.4);
    rimLight.position.set(3, -2, 2);
    scene.add(rimLight);

    const frontLight = new THREE.PointLight(0x8cdbff, 3.5, 9);
    frontLight.position.set(0, -2.3, 1.2);
    scene.add(frontLight);

    let mixer = null;
    let modelRoot = null;
    let introFinished = false;
    let isHoveringMicro = false;
    let idleAngle = 0;

    const microMeshes = [];
    const edgeMeshes = [];
    const clock = new THREE.Clock();
    const pointer = new THREE.Vector2();

    const normalMicroMaterial = new THREE.MeshBasicMaterial({
      color: new THREE.Color(0x6fc8ff),
      transparent: true,
      opacity: 0.82,
      side: THREE.DoubleSide,
      depthTest: false,
      depthWrite: false
    });

    const hoverMicroMaterial = new THREE.MeshBasicMaterial({
      color: new THREE.Color(0xd3f6ff),
      transparent: true,
      opacity: 1.0,
      side: THREE.DoubleSide,
      depthTest: false,
      depthWrite: false
    });

    const lensMaterial = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(0x7fcfff),
      roughness: 0.04,
      metalness: 0.0,
      transmission: 0.18,
      transparent: true,
      opacity: 0.28,
      side: THREE.DoubleSide,
      depthWrite: false,
      clearcoat: 1.0,
      clearcoatRoughness: 0.04
    });

    const edgeMaterial = new THREE.MeshBasicMaterial({
      color: new THREE.Color(0x8bdfff),
      transparent: true,
      opacity: 0.95,
      side: THREE.DoubleSide,
      depthTest: false,
      depthWrite: false
    });

    const loader = new GLTFLoader();

    loader.load(
      MODEL_FILE,

      function (gltf) {
        modelRoot = gltf.scene;

        modelRoot.traverse((obj) => {
          const name = (obj.name || "").toLowerCase();

          if (
            name.includes("background") ||
            name.includes("floor") ||
            name.includes("strip") ||
            name.includes("light") ||
            name.includes("camera")
          ) {
            obj.visible = false;
          }

          if (!obj.isMesh) return;

          obj.frustumCulled = false;

          if (name.includes("micro")) {
            obj.material = normalMicroMaterial;
            obj.renderOrder = 30;
            microMeshes.push(obj);
          }

          else if (name.includes("edge") || name.includes("glow")) {
            obj.material = edgeMaterial;
            obj.renderOrder = 20;
            edgeMeshes.push(obj);
          }

          else if (name.includes("lens") || name.includes("glass")) {
            obj.material = lensMaterial;
            obj.renderOrder = 5;
          }
        });

        const box = new THREE.Box3().setFromObject(modelRoot);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        modelRoot.position.x -= center.x;
        modelRoot.position.y -= center.y;
        modelRoot.position.z -= center.z;

        const maxSize = Math.max(size.x, size.y, size.z);
        const scale = 2.45 / maxSize;
        modelRoot.scale.setScalar(scale);

        modelRoot.position.x = 0;
        modelRoot.position.y = 0;
        modelRoot.position.z = 0;

        scene.add(modelRoot);

        if (gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(modelRoot);

          gltf.animations.forEach((clip) => {
            const action = mixer.clipAction(clip);
            action.reset();
            action.setLoop(THREE.LoopOnce, 1);
            action.clampWhenFinished = true;
            action.enabled = true;
            action.play();
          });

          setTimeout(() => {
            introFinished = true;
          }, 4600);
        } else {
          introFinished = true;
        }
      },

      undefined,

      function (error) {
        console.error("Ошибка загрузки GLB:", error);
      }
    );

    function setMicroHoverState(active) {
      if (isHoveringMicro === active) return;

      isHoveringMicro = active;

      microMeshes.forEach((mesh) => {
        mesh.material = active ? hoverMicroMaterial : normalMicroMaterial;
      });

      edgeMeshes.forEach((mesh) => {
        mesh.material.opacity = active ? 1.0 : 0.95;
      });

      popup.classList.toggle("active", active);
      popupLine.classList.toggle("active", active);
    }

    function checkPointerOverMicro(event) {
      const rect = container.getBoundingClientRect();

      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      pointer.x = (x / rect.width) * 2 - 1;
      pointer.y = -(y / rect.height) * 2 + 1;

      /*
        Стабильная зона наведения.
        Мы не ловим каждую микролинзу отдельно, потому что они очень маленькие.
        Наведение срабатывает по центральной зоне колец.
      */
      const centerX = rect.width * 0.5;
      const centerY = rect.height * 0.5;

      const dx = x - centerX;
      const dy = y - centerY;

      const distance = Math.sqrt(dx * dx + dy * dy);
      const minSide = Math.min(rect.width, rect.height);

      const innerRadius = minSide * 0.06;
      const outerRadius = minSide * 0.34;

      const isInsideMicroZone = distance > innerRadius && distance < outerRadius;

      setMicroHoverState(isInsideMicroZone);
    }

    container.addEventListener("mousemove", checkPointerOverMicro);

    container.addEventListener("mouseleave", () => {
      setMicroHoverState(false);
    });

    container.addEventListener("touchstart", (event) => {
      if (!event.touches || !event.touches[0]) return;

      const touch = event.touches[0];

      checkPointerOverMicro({
        clientX: touch.clientX,
        clientY: touch.clientY
      });
    }, { passive: true });

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();

      if (mixer) {
        mixer.update(delta);
      }

      if (modelRoot && introFinished) {
        if (!isHoveringMicro) {
          idleAngle += delta * 0.55;
        }

        modelRoot.rotation.y = Math.sin(idleAngle) * 0.16;
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
