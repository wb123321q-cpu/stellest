<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stellest 3D Lens</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #020812;
    }

    .stellest-hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 44%, rgba(90, 190, 255, 0.22) 0%, rgba(8, 27, 45, 0.84) 45%, rgba(2, 8, 18, 1) 100%),
        linear-gradient(135deg, #04101c 0%, #010408 100%);
    }

    .stellest-hero::before {
      content: "";
      position: absolute;
      left: -10%;
      top: 52%;
      width: 120%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(180, 230, 255, 0.42), transparent);
      box-shadow: 0 0 26px rgba(72, 175, 255, 0.34);
      z-index: 1;
      pointer-events: none;
    }

    .stellest-hero::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 560px;
      height: 560px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(120, 210, 255, 0.12), transparent 70%);
      filter: blur(18px);
      z-index: 1;
      pointer-events: none;
    }

    .stellest-brand {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      pointer-events: none;
      color: #eaf7ff;
      text-shadow: 0 0 28px rgba(93, 190, 255, 0.28);
      white-space: nowrap;
    }

    .stellest-brand__eyebrow {
      margin-bottom: 4px;
      font-size: 12px;
      line-height: 1;
      letter-spacing: 5px;
      font-weight: 700;
      opacity: 0.86;
    }

    .stellest-brand__title {
      font-size: clamp(34px, 6vw, 54px);
      line-height: 0.95;
      letter-spacing: -0.055em;
      font-weight: 300;
      color: #e7f7ff;
    }

    #stellestCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .micro-popup {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 320px;
      padding: 24px 26px;
      border: 1px solid rgba(190, 235, 255, 0.24);
      border-radius: 24px;
      background: rgba(8, 22, 38, 0.52);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow:
        0 18px 48px rgba(0, 0, 0, 0.46),
        0 0 54px rgba(88, 190, 255, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.20);
      color: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 7;
      transform: translate(118px, -98px) scale(0.95);
      transition:
        opacity 0.36s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.36s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .micro-popup.active {
      opacity: 1;
      transform: translate(138px, -98px) scale(1);
    }

    .popup-num {
      margin-bottom: 8px;
      font-size: 52px;
      line-height: 1;
      font-weight: 300;
      background: linear-gradient(135deg, #ffffff 0%, #9de5ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .popup-title {
      margin-bottom: 12px;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 650;
      color: #bdeaff;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .popup-text {
      margin: 0;
      font-size: 15px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.78);
    }

    .popup-line {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 155px;
      height: 1px;
      transform: translate(-18px, 2px);
      background: linear-gradient(90deg, rgba(170, 230, 255, 0.95), transparent);
      box-shadow: 0 0 20px rgba(72, 175, 255, 0.52);
      opacity: 0;
      pointer-events: none;
      z-index: 6;
      transition: opacity 0.3s ease;
    }

    .popup-line.active {
      opacity: 1;
    }

    @media (max-width: 900px) {
      .stellest-brand {
        top: 18px;
      }

      .stellest-brand__eyebrow {
        font-size: 10px;
        letter-spacing: 4px;
      }

      .stellest-brand__title {
        font-size: 36px;
      }

      .micro-popup {
        left: 18px;
        right: 18px;
        top: auto;
        bottom: 24px;
        width: calc(100% - 36px);
        box-sizing: border-box;
        transform: translateY(18px) scale(0.96);
      }

      .micro-popup.active {
        transform: translateY(0) scale(1);
      }

      .popup-line {
        display: none;
      }

      .popup-num {
        font-size: 42px;
      }

      .popup-title {
        font-size: 16px;
      }

      .popup-text {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <section class="stellest-hero">
    <div class="stellest-brand">
      <div class="stellest-brand__eyebrow">ESSILOR</div>
      <div class="stellest-brand__title">Stellest</div>
    </div>

    <div id="stellestCanvas"></div>

    <div class="popup-line" id="popupLine"></div>

    <div class="micro-popup" id="microPopup">
      <div class="popup-num">1021</div>
      <div class="popup-title">микролинза</div>
      <p class="popup-text">
        Микроструктура формирует объёмную зону дефокуса и помогает замедлять прогрессирование близорукости у детей.
      </p>
    </div>
  </section>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

    const container = document.getElementById("stellestCanvas");
    const popup = document.getElementById("microPopup");
    const popupLine = document.getElementById("popupLine");

    const MODEL_FILE = "./Stellest%202.0.glb";

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      26,
      container.clientWidth / container.clientHeight,
      0.1,
      100
    );

    camera.position.set(0, 0, 4.45);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;

    container.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(container.clientWidth, container.clientHeight),
      0.24,
      0.55,
      0.18
    );
    composer.addPass(bloomPass);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    const ambient = new THREE.AmbientLight(0xffffff, 0.82);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xdff4ff, 2.2);
    keyLight.position.set(-3, 3, 4);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x5dc2ff, 2.9);
    rimLight.position.set(3, -2, -2);
    scene.add(rimLight);

    const frontLight = new THREE.PointLight(0xa8e8ff, 1.8, 8);
    frontLight.position.set(0, 0.7, 2.8);
    scene.add(frontLight);

    const glintLight = new THREE.PointLight(0xffffff, 0.0, 6);
    glintLight.position.set(-1.35, 0.8, 2.2);
    scene.add(glintLight);

    let mixer = null;
    let modelRoot = null;
    let introFinished = false;
    let isHoveringMicro = false;
    let hoverProgress = 0;
    let idleAngle = 0;

    const microMeshes = [];
    const edgeMeshes = [];

    const clock = new THREE.Clock();
    const mouse = new THREE.Vector2(0, 0);
    const targetRotation = new THREE.Vector2(0, 0);

    const colorMicroBase = new THREE.Color(0xbfefff);
    const colorMicroHover = new THREE.Color(0xffffff);

    const emissiveBase = new THREE.Color(0x36b4ff);
    const emissiveHover = new THREE.Color(0xe7fdff);

    const microMaterial = new THREE.MeshPhysicalMaterial({
      color: colorMicroBase,
      emissive: emissiveBase,
      emissiveIntensity: 0.95,
      transparent: true,
      opacity: 0.98,
      roughness: 0.05,
      transmission: 0.0,
      side: THREE.DoubleSide,
      depthTest: false,
      depthWrite: false
    });

    const edgeMaterial = new THREE.MeshBasicMaterial({
      color: new THREE.Color(0x9adfff),
      transparent: true,
      opacity: 0.85,
      side: THREE.DoubleSide,
      depthTest: false,
      depthWrite: false
    });

    /* Главное изменение:
       возвращаем красивый прошлый фон,
       а линзу делаем прозрачной с лёгким холодным оттенком,
       а не серой/молочной. */
    const lensMaterial = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(0xe9fbff),
      transmission: 0.985,
      opacity: 0.20,
      metalness: 0,
      roughness: 0.012,
      ior: 1.52,
      thickness: 0.34,
      clearcoat: 1.0,
      clearcoatRoughness: 0.01,
      attenuationColor: new THREE.Color(0xa8e3ff),
      attenuationDistance: 5.5,
      side: THREE.DoubleSide,
      transparent: true,
      depthWrite: false
    });

    const loader = new GLTFLoader();

    loader.load(
      MODEL_FILE,
      (gltf) => {
        const originalScene = gltf.scene;
        const modelInner = originalScene;

        modelInner.traverse((obj) => {
          const name = (obj.name || "").toLowerCase();

          if (
            name.includes("background") ||
            name.includes("floor") ||
            name.includes("strip") ||
            name.includes("light") ||
            name.includes("camera")
          ) {
            obj.visible = false;
          }

          if (!obj.isMesh) return;

          obj.frustumCulled = false;

          if (name.includes("micro")) {
            obj.material = microMaterial;
            obj.renderOrder = 30;
            microMeshes.push(obj);
          } else if (name.includes("edge") || name.includes("glow")) {
            obj.material = edgeMaterial;
            obj.renderOrder = 20;
            edgeMeshes.push(obj);
          } else if (name.includes("lens") || name.includes("glass")) {
            obj.material = lensMaterial;
            obj.renderOrder = 5;
          }
        });

        const box = new THREE.Box3().setFromObject(modelInner);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        modelInner.position.sub(center);

        const pivot = new THREE.Group();
        scene.add(pivot);
        pivot.add(modelInner);

        modelRoot = pivot;

        const maxSize = Math.max(size.x, size.y, size.z);
        modelRoot.scale.setScalar(3.48 / maxSize);
        modelRoot.position.y = -0.12;

        if (gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(originalScene);

          gltf.animations.forEach((clip) => {
            const action = mixer.clipAction(clip);
            action.reset();
            action.setLoop(THREE.LoopOnce, 1);
            action.clampWhenFinished = true;
            action.play();
          });

          setTimeout(() => {
            introFinished = true;
          }, 4600);
        } else {
          introFinished = true;
        }
      },
      undefined,
      (error) => {
        console.error("Ошибка загрузки GLB:", error);
      }
    );

    function checkPointer(event) {
      const rect = container.getBoundingClientRect();

      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      mouse.x = (x / rect.width) * 2 - 1;
      mouse.y = -(y / rect.height) * 2 + 1;

      const centerX = rect.width * 0.5;
      const centerY = rect.height * 0.53;

      const dx = x - centerX;
      const dy = y - centerY;

      const distance = Math.sqrt(dx * dx + dy * dy);
      const minSide = Math.min(rect.width, rect.height);

      const isInside = distance > minSide * 0.07 && distance < minSide * 0.42;

      if (isHoveringMicro !== isInside) {
        isHoveringMicro = isInside;
        popup.classList.toggle("active", isInside);
        popupLine.classList.toggle("active", isInside);
      }
    }

    container.addEventListener("mousemove", checkPointer);

    container.addEventListener("mouseleave", () => {
      isHoveringMicro = false;
      mouse.set(0, 0);
      popup.classList.remove("active");
      popupLine.classList.remove("active");
    });

    container.addEventListener(
      "touchstart",
      (event) => {
        if (event.touches && event.touches[0]) {
          checkPointer(event.touches[0]);
        }
      },
      { passive: true }
    );

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1);

      if (mixer) {
        mixer.update(delta);
      }

      if (modelRoot && introFinished) {
        if (!isHoveringMicro) {
          idleAngle += delta * 0.46;
        }

        targetRotation.x = mouse.y * 0.06;
        targetRotation.y = mouse.x * 0.085 + Math.sin(idleAngle) * 0.11;

        modelRoot.rotation.x += (targetRotation.x - modelRoot.rotation.x) * delta * 4;
        modelRoot.rotation.y += (targetRotation.y - modelRoot.rotation.y) * delta * 4;

        const targetHoverVal = isHoveringMicro ? 1 : 0;
        hoverProgress += (targetHoverVal - hoverProgress) * delta * 6;

        microMaterial.opacity = 0.98;
        microMaterial.emissiveIntensity = 0.95 + hoverProgress * 2.8;
        microMaterial.color.lerpColors(colorMicroBase, colorMicroHover, hoverProgress);
        microMaterial.emissive.lerpColors(emissiveBase, emissiveHover, hoverProgress);

        edgeMaterial.opacity = 0.85 + hoverProgress * 0.12;

        /* Линза остаётся прозрачной, но на hover чуть лучше читается */
        lensMaterial.opacity = 0.20 + hoverProgress * 0.04;
        lensMaterial.roughness = 0.012 + hoverProgress * 0.004;

        /* Свечение микролинз как на примере — только при наведении сильнее */
        bloomPass.strength = 0.24 + hoverProgress * 1.55;
        bloomPass.radius = 0.55 + hoverProgress * 0.24;
        bloomPass.threshold = 0.18 - hoverProgress * 0.07;

        /* Скользящий блик по стеклу */
        glintLight.intensity = 0.35 + hoverProgress * 2.4;
        glintLight.position.x = -1.25 + Math.sin(clock.elapsedTime * 1.15) * 0.55;
        glintLight.position.y = 0.85 + Math.cos(clock.elapsedTime * 0.9) * 0.18;
      }

      composer.render();
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(container.clientWidth, container.clientHeight);
      composer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
