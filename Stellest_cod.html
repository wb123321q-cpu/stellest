<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Stellest 3D Lens</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #020812;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .stellest-hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 48%, rgba(70, 170, 255, 0.28) 0%, rgba(7, 24, 39, 0.75) 38%, rgba(2, 8, 18, 1) 78%),
        linear-gradient(135deg, #061827 0%, #020812 100%);
    }

    .stellest-hero::before {
      content: "";
      position: absolute;
      left: -10%;
      top: 50%;
      width: 120%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(125, 205, 255, 0.85), transparent);
      box-shadow: 0 0 28px rgba(72, 175, 255, 0.65);
      opacity: 0.65;
      z-index: 1;
      pointer-events: none;
    }

    #stellestCanvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 64%;
      height: 100%;
      z-index: 2;
    }

    .content-card {
      position: absolute;
      right: 7%;
      top: 50%;
      transform: translateY(-50%);
      width: 420px;
      z-index: 3;
      color: #eaf7ff;
    }

    .brand {
      font-size: 15px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(234, 247, 255, 0.85);
      margin-bottom: 10px;
    }

    .title {
      font-size: 76px;
      line-height: 0.95;
      font-weight: 300;
      letter-spacing: -2px;
      color: #dff4ff;
      text-shadow: 0 0 28px rgba(102, 194, 255, 0.22);
      margin-bottom: 18px;
    }

    .subtitle {
      font-size: 19px;
      line-height: 1.45;
      text-transform: uppercase;
      color: rgba(234, 247, 255, 0.82);
      margin-bottom: 34px;
    }

    .info-box {
      padding: 26px 30px;
      border: 1px solid rgba(137, 207, 255, 0.45);
      border-radius: 22px;
      background: rgba(4, 20, 36, 0.58);
      backdrop-filter: blur(14px);
      box-shadow:
        0 0 60px rgba(56, 164, 255, 0.16),
        inset 0 0 30px rgba(100, 190, 255, 0.06);
    }

    .num {
      font-size: 54px;
      line-height: 1;
      font-weight: 700;
      color: #8bcfff;
      margin-bottom: 4px;
    }

    .label {
      font-size: 25px;
      line-height: 1.2;
      color: #8bcfff;
      margin-bottom: 18px;
      text-transform: uppercase;
    }

    .text {
      font-size: 17px;
      line-height: 1.55;
      color: rgba(234, 247, 255, 0.88);
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 34px;
      padding: 15px 28px;
      border: 1px solid rgba(137, 207, 255, 0.6);
      border-radius: 999px;
      color: #dff4ff;
      text-decoration: none;
      font-size: 15px;
      letter-spacing: 1px;
      background: rgba(9, 38, 65, 0.42);
      box-shadow: 0 0 26px rgba(56, 164, 255, 0.12);
      transition: 0.25s ease;
    }

    .button:hover {
      background: rgba(28, 110, 175, 0.32);
      box-shadow: 0 0 34px rgba(56, 164, 255, 0.28);
    }

    .status {
      margin-top: 14px;
      font-size: 13px;
      color: rgba(234, 247, 255, 0.5);
    }

    @media (max-width: 900px) {
      body {
        overflow-y: auto;
      }

      .stellest-hero {
        height: 900px;
      }

      #stellestCanvas {
        width: 100%;
        height: 56%;
      }

      .content-card {
        left: 20px;
        right: 20px;
        top: auto;
        bottom: 34px;
        transform: none;
        width: auto;
      }

      .title {
        font-size: 48px;
      }

      .subtitle {
        font-size: 15px;
        margin-bottom: 20px;
      }

      .info-box {
        padding: 22px;
      }

      .num {
        font-size: 40px;
      }

      .label {
        font-size: 20px;
      }

      .text {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <section class="stellest-hero">
    <div id="stellestCanvas"></div>

    <div class="content-card">
      <div class="brand">ESSILOR</div>
      <div class="title">Stellest</div>
      <div class="subtitle">Линзы для контроля миопии у детей</div>

      <div class="info-box">
        <div class="num">1021</div>
        <div class="label">микролинза</div>
        <div class="text">
          Создают зону миопического дефокуса, которая помогает замедлять прогрессирование близорукости у детей.
        </div>
      </div>

      <a class="button" href="https://miroptikilubertsy.ru/stellest_linzy_kontrol_miopii_u_detei">
        Узнать подробнее →
      </a>

      <div class="status" id="statusText">Загрузка 3D-анимации...</div>
    </div>
  </section>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const container = document.getElementById("stellestCanvas");
    const statusText = document.getElementById("statusText");

    const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  28,
  container.clientWidth / container.clientHeight,
  0.1,
  100
);

camera.position.set(0.35, -0.35, 5.4);
camera.up.set(0, 1, 0);
camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    container.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(0x9fdcff, 1.35);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xb8e9ff, 2.5);
    keyLight.position.set(-3, -4, 3);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x4ab8ff, 1.8);
    rimLight.position.set(3, -2, 1);
    scene.add(rimLight);

    const frontLight = new THREE.PointLight(0x6dc8ff, 2.8, 8);
    frontLight.position.set(0, -2.2, 0.4);
    scene.add(frontLight);

    let mixer = null;
    let modelRoot = null;
    const clock = new THREE.Clock();

    const loader = new GLTFLoader();

    loader.load(
      "./Stellest%202.0.glb",

      function (gltf) {
        modelRoot = gltf.scene;

        modelRoot.traverse((obj) => {
          const name = (obj.name || "").toLowerCase();

          if (
            name.includes("background") ||
            name.includes("floor") ||
            name.includes("strip") ||
            name.includes("light")
          ) {
            obj.visible = false;
          }

          if (obj.isMesh) {
            obj.frustumCulled = false;

            if (obj.material) {
              obj.material.transparent = true;
              obj.material.depthWrite = false;
              obj.material.side = THREE.DoubleSide;

              if (obj.material.color) {
                obj.material.color.convertSRGBToLinear();
              }
            }
          }
        });

        const box = new THREE.Box3().setFromObject(modelRoot);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        modelRoot.position.x -= center.x;
        modelRoot.position.y -= center.y;
        modelRoot.position.z -= center.z;

        const maxSize = Math.max(size.x, size.y, size.z);
        const scale = 2.85 / maxSize;
        modelRoot.scale.setScalar(scale);

        modelRoot.position.x = -0.55;
        modelRoot.position.y = 0;
        modelRoot.position.z = 0;

        scene.add(modelRoot);

        console.log("GLB загружен");
        console.log("Найдено анимаций:", gltf.animations.length);
        console.log("Названия анимаций:", gltf.animations.map(a => a.name));

        if (gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(modelRoot);

          gltf.animations.forEach((clip) => {
            const action = mixer.clipAction(clip);
            action.reset();
            action.setLoop(THREE.LoopRepeat, Infinity);
            action.clampWhenFinished = false;
            action.play();
          });

          statusText.textContent = "3D-анимация запущена";
        } else {
          statusText.textContent = "GLB загрузился, но внутри нет анимаций";
        }
      },

      function (xhr) {
        if (xhr.total) {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          statusText.textContent = "Загрузка 3D: " + percent + "%";
        }
      },

      function (error) {
        console.error("Ошибка загрузки GLB:", error);
        statusText.textContent = "Ошибка загрузки GLB. Проверь название файла.";
      }
    );

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();

      if (mixer) {
        mixer.update(delta);
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
