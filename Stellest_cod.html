<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stellest 3D Lens - Premium</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #020812;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
    }

    .stellest-hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgba(40, 140, 255, 0.15) 0%, rgba(7, 24, 39, 0.8) 50%, rgba(2, 8, 18, 1) 100%),
        linear-gradient(135deg, #04101c 0%, #010408 100%);
    }

    .stellest-hero::before {
      content: "";
      position: absolute;
      left: -10%;
      top: 50%;
      width: 120%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(137, 207, 255, 0.4), transparent);
      box-shadow: 0 0 20px rgba(72, 175, 255, 0.3);
      z-index: 1;
      pointer-events: none;
    }

    #stellestCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* GLASSMORPHISM POPUP */
    .micro-popup {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(140px, -130px) scale(0.95);
      width: 320px;
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      background: rgba(10, 25, 45, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 
        0 16px 40px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      color: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .micro-popup.active {
      opacity: 1;
      transform: translate(160px, -130px) scale(1);
    }

    .popup-num {
      font-size: 52px;
      line-height: 1;
      font-weight: 300;
      background: linear-gradient(135deg, #ffffff 0%, #8bcfff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .popup-title {
      font-size: 18px;
      font-weight: 600;
      color: #bde4ff;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .popup-text {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 0; 
    }

    .popup-line {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 190px;
      height: 1px;
      transform: translate(-10px, -10px);
      background: linear-gradient(90deg, rgba(137, 207, 255, 0.8), transparent);
      opacity: 0;
      pointer-events: none;
      z-index: 4;
      transition: opacity 0.3s ease;
    }

    .popup-line.active { opacity: 1; }

    @media (max-width: 900px) {
      .micro-popup {
        left: 20px;
        right: 20px;
        top: auto;
        bottom: 40px;
        width: calc(100% - 40px);
        box-sizing: border-box;
        transform: translateY(20px) scale(0.95);
      }
      .micro-popup.active {
        transform: translateY(0) scale(1);
      }
      .popup-line { display: none; }
    }
  </style>
</head>

<body>
  <section class="stellest-hero">
    <div id="stellestCanvas"></div>
    <div class="popup-line" id="popupLine"></div>

    <div class="micro-popup" id="microPopup">
      <div class="popup-num">1021</div>
      <div class="popup-title">микролинза</div>
      <div class="popup-text">
        Микроструктура формирует объемную зону дефокуса, эффективно замедляя прогрессирование близорукости у детей.
      </div>
    </div>
  </section>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

    const container = document.getElementById("stellestCanvas");
    const popup = document.getElementById("microPopup");
    const popupLine = document.getElementById("popupLine");
    const MODEL_FILE = "./Stellest%202.0.glb";

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(28, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(0, 0, 5.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    const ambient = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xd7f4ff, 2.5);
    keyLight.position.set(-3, 3, 4);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x62c9ff, 3.0);
    rimLight.position.set(3, -2, -2);
    scene.add(rimLight);

    let mixer = null;
    let modelRoot = null;
    let introFinished = false;
    let isHoveringMicro = false;
    let hoverProgress = 0; 
    let idleAngle = 0;

    const microMeshes = [];
    const edgeMeshes = [];
    const clock = new THREE.Clock();
    
    const mouse = new THREE.Vector2(0, 0);
    const targetRotation = new THREE.Vector2(0, 0);

    const colorMicroBase = new THREE.Color(0x5caeff);
    const colorMicroHover = new THREE.Color(0xd3f6ff);

    const microMaterial = new THREE.MeshPhysicalMaterial({
      color: colorMicroBase,
      transparent: true,
      opacity: 0.7,
      roughness: 0.2,
      transmission: 0.5,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    const edgeMaterial = new THREE.MeshBasicMaterial({
      color: new THREE.Color(0x62c9ff),
      transparent: true,
      opacity: 0.85,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    // Обновленный материал стекла: оригинальный цвет + физика оптики
    const lensMaterial = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(0x7fcfff), // Ваш оригинальный голубой цвет
      transmission: 0.95, // Максимальное светопропускание (эффект стекла)
      opacity: 1.0,       // Для физического стекла с transmission opacity должна быть 1.0
      metalness: 0,
      roughness: 0.02,    // Практически гладкое
      ior: 1.52,          // Индекс преломления оптической линзы
      thickness: 0.6,     // Толщина для искажения фона (эффект преломления)
      clearcoat: 1.0,     // Идеальный глянцевый блик
      clearcoatRoughness: 0.02,
      attenuationColor: new THREE.Color(0x5caeff), // Объемный цвет (края выглядят насыщеннее)
      attenuationDistance: 2.0, // Глубина проникновения света
      side: THREE.DoubleSide,
      transparent: true,
      depthWrite: false
    });

    const loader = new GLTFLoader();

    loader.load(
      MODEL_FILE,
      (gltf) => {
        modelRoot = gltf.scene;

        modelRoot.traverse((obj) => {
          const name = (obj.name || "").toLowerCase();

          if (name.includes("background") || name.includes("floor") || name.includes("strip") || name.includes("light") || name.includes("camera")) {
            obj.visible = false;
          }

          if (!obj.isMesh) return;
          obj.frustumCulled = false;

          if (name.includes("micro")) {
            obj.material = microMaterial;
            obj.renderOrder = 30;
            microMeshes.push(obj);
          } else if (name.includes("edge") || name.includes("glow")) {
            obj.material = edgeMaterial;
            obj.renderOrder = 20;
            edgeMeshes.push(obj);
          } else if (name.includes("lens") || name.includes("glass")) {
            obj.material = lensMaterial;
            obj.renderOrder = 5;
          }
        });

        const box = new THREE.Box3().setFromObject(modelRoot);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        modelRoot.position.sub(center);
        
        const pivot = new THREE.Group();
        scene.add(pivot);
        pivot.add(modelRoot);
        modelRoot = pivot;

        const maxSize = Math.max(size.x, size.y, size.z);
        modelRoot.scale.setScalar(2.6 / maxSize);

        if (gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(gltf.scene);
          gltf.animations.forEach((clip) => {
            const action = mixer.clipAction(clip);
            action.setLoop(THREE.LoopOnce, 1);
            action.clampWhenFinished = true;
            action.play();
          });
          setTimeout(() => introFinished = true, 4600);
        } else {
          introFinished = true;
        }
      },
      undefined,
      (error) => console.error("Ошибка загрузки GLB:", error)
    );

    function checkPointer(event) {
      const rect = container.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      mouse.x = (x / rect.width) * 2 - 1;
      mouse.y = -(y / rect.height) * 2 + 1;

      const distance = Math.sqrt(Math.pow(x - rect.width * 0.5, 2) + Math.pow(y - rect.height * 0.5, 2));
      const minSide = Math.min(rect.width, rect.height);
      const isInside = distance > (minSide * 0.08) && distance < (minSide * 0.38);

      if (isHoveringMicro !== isInside) {
        isHoveringMicro = isInside;
        popup.classList.toggle("active", isInside);
        popupLine.classList.toggle("active", isInside);
      }
    }

    container.addEventListener("mousemove", checkPointer);
    container.addEventListener("mouseleave", () => {
      isHoveringMicro = false;
      mouse.set(0, 0);
      popup.classList.remove("active");
      popupLine.classList.remove("active");
    });
    container.addEventListener("touchstart", (e) => e.touches[0] && checkPointer(e.touches[0]), { passive: true });

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);

      if (mixer) mixer.update(delta);

      if (modelRoot && introFinished) {
        if (!isHoveringMicro) {
          idleAngle += delta * 0.5;
        }

        targetRotation.x = mouse.y * 0.12;
        targetRotation.y = mouse.x * 0.15 + (Math.sin(idleAngle) * 0.14);

        modelRoot.rotation.x += (targetRotation.x - modelRoot.rotation.x) * delta * 4;
        modelRoot.rotation.y += (targetRotation.y - modelRoot.rotation.y) * delta * 4;

        const targetHoverVal = isHoveringMicro ? 1 : 0;
        hoverProgress += (targetHoverVal - hoverProgress) * delta * 6;

        microMaterial.opacity = 0.7 + (hoverProgress * 0.3);
        microMaterial.color.lerpColors(colorMicroBase, colorMicroHover, hoverProgress);
        edgeMaterial.opacity = 0.85 + (hoverProgress * 0.15);
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
